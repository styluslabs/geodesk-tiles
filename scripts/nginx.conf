# 1. HTTP Server (Port 80)
server {
    listen 80;
    listen [::]:80;
    server_name tiles.styluslabs.com ~^tiles-.*\.styluslabs\.com$;

    # Redirect acme.sh HTTP-01 challenges to tiles-a (which intiates them)
    location /.well-known/acme-challenge/ {
        if ($hostname != "tiles-a.styluslabs.com") {
            return 301 http://tiles-a.styluslabs.com$request_uri;
        }
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;

        # Pass along standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirect all other HTTP traffic to HTTPS
    #location / {
    #    return 301 https://$host$request_uri;
    #}
}

# 2. HTTPS Server (Port 443)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tiles.styluslabs.com ~^tiles-.*\.styluslabs\.com$;

    # Certificate paths
    ssl_certificate /etc/nginx/ssl/tiles.styluslabs.com.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/tiles.styluslabs.com.key.pem;

    # Hardened SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Reverse proxy to your app on localhost:8080
    location / {
        proxy_pass http://127.0.0.1:8080;

        # Pass along standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
